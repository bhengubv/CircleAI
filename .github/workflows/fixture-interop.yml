name: Fixture Interop — Cross-Language Math Validation

# Validates that AffectState, BiometricMatcher, and GoalProgress produce
# identical results (within 1e-5) across all 10 language implementations.
# Any divergence here is a cross-platform determinism bug.

on:
  push:
    paths:
      - "fixtures/**"
      - "src/Circle.AI.Memory/**"
      - "python/src/circle_ai/memory/**"
      - "typescript/src/memory/**"
      - "go/memory.go"
      - "kotlin/src/main/**"
      - "swift/Sources/CircleAI/Memory.swift"
      - "rust/src/memory/**"
      - "c/src/memory.c"
      - "harmonyos/src/main/ets/memory/**"
      - "android/circle-ai/src/main/**"
  pull_request:
    paths:
      - "fixtures/**"
  workflow_dispatch: {}

jobs:
  # Each language runs its fixture-driven tests.
  # The fixtures ARE the cross-language contract — if all languages pass,
  # interop is guaranteed.

  interop-csharp:
    name: "Interop: C# (reference)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: >
          dotnet test src/Circle.AI.sln
          --configuration Release
          --filter "FullyQualifiedName~AffectState|FullyQualifiedName~Biometric|FullyQualifiedName~GoalProgress"
          --logger "console;verbosity=normal"

  interop-python:
    name: "Interop: Python"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - working-directory: python
        run: |
          pip install -e ".[dev]"
          pytest tests/test_affect_state.py tests/test_biometric_matcher.py tests/test_goal_progress.py -v

  interop-typescript:
    name: "Interop: TypeScript"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - working-directory: typescript
        run: |
          npm ci
          npm test -- --testPathPattern="affect_state|biometric_matcher|goal_progress"

  interop-go:
    name: "Interop: Go"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - working-directory: go
        run: go test ./tests/ -run "TestAffectState|TestBiometric|TestGoalProgress" -v

  interop-kotlin:
    name: "Interop: Kotlin"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - uses: gradle/actions/setup-gradle@v3
      - working-directory: kotlin
        run: ./gradlew test --tests "*AffectState*" --tests "*Biometric*" --tests "*GoalProgress*" --info

  interop-swift:
    name: "Interop: Swift"
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
      - working-directory: swift
        run: swift test --filter "AffectState|Biometric|GoalProgress" --verbose

  interop-rust:
    name: "Interop: Rust"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - working-directory: rust
        run: cargo test affect_state biometric goal_progress --verbose

  interop-c:
    name: "Interop: C"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y cmake build-essential
      - working-directory: c
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          ctest --test-dir build -R "test_affect_state|test_biometric|test_goal" --output-on-failure

  interop-android:
    name: "Interop: Android"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - uses: gradle/actions/setup-gradle@v3
      - working-directory: android
        run: >
          ./gradlew :circle-ai:test
          --tests "*AffectState*"
          --tests "*Biometric*"
          --tests "*GoalProgress*"
          --info

  # ──────────────────────────────────────────────────────────────────────────
  # Summary: all languages must agree
  # ──────────────────────────────────────────────────────────────────────────
  interop-all-agree:
    name: "All languages agree on fixture math"
    runs-on: ubuntu-latest
    needs:
      - interop-csharp
      - interop-python
      - interop-typescript
      - interop-go
      - interop-kotlin
      - interop-swift
      - interop-rust
      - interop-c
      - interop-android
    steps:
      - run: |
          echo "✓ All 9 language implementations produce identical results"
          echo "  within 1e-5 tolerance against fixtures/affect_state.json,"
          echo "  fixtures/facex_biometric_vectors.json, and fixtures/goal_progress.json"
