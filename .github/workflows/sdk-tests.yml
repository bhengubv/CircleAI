name: SDK Tests — All Languages

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: sdk-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # C# (reference implementation)
  # ──────────────────────────────────────────────────────────────────────────
  test-csharp:
    name: C# / .NET 8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet test src/Circle.AI.sln --configuration Release --logger "console;verbosity=normal"

  # ──────────────────────────────────────────────────────────────────────────
  # Python
  # ──────────────────────────────────────────────────────────────────────────
  test-python:
    name: Python 3.11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - working-directory: python
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
          pytest tests/ -v --tb=short

  # ──────────────────────────────────────────────────────────────────────────
  # TypeScript
  # ──────────────────────────────────────────────────────────────────────────
  test-typescript:
    name: TypeScript / Node 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - working-directory: typescript
        run: |
          npm ci
          npm test

  # ──────────────────────────────────────────────────────────────────────────
  # Go
  # ──────────────────────────────────────────────────────────────────────────
  test-go:
    name: Go 1.22
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - working-directory: go
        run: go test ./... -v -count=1

  # ──────────────────────────────────────────────────────────────────────────
  # Kotlin JVM
  # ──────────────────────────────────────────────────────────────────────────
  test-kotlin:
    name: Kotlin JVM / JDK 17
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - uses: gradle/actions/setup-gradle@v3
      - working-directory: kotlin
        run: ./gradlew test --info

  # ──────────────────────────────────────────────────────────────────────────
  # Swift
  # ──────────────────────────────────────────────────────────────────────────
  test-swift:
    name: Swift 5.9 / macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
      - working-directory: swift
        run: swift test --verbose

  # ──────────────────────────────────────────────────────────────────────────
  # Rust
  # ──────────────────────────────────────────────────────────────────────────
  test-rust:
    name: Rust stable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - working-directory: rust
        run: cargo test --verbose

  # ──────────────────────────────────────────────────────────────────────────
  # C
  # ──────────────────────────────────────────────────────────────────────────
  test-c:
    name: C11 / CMake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y cmake build-essential
      - working-directory: c
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          ctest --test-dir build --output-on-failure

  # ──────────────────────────────────────────────────────────────────────────
  # HarmonyOS / ArkTS (validated as TypeScript via tsc)
  # ──────────────────────────────────────────────────────────────────────────
  test-harmonyos:
    name: HarmonyOS / ArkTS (TypeScript validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - working-directory: harmonyos
        run: |
          npm install -g typescript
          npx tsc --version
          # Validate .ets files by treating them as TypeScript
          find src/ -name "*.ets" | xargs -I{} npx tsc --noEmit --strict --target ES2022 --lib ES2022 {}
          # Run test assertions
          find tests/ -name "*.ets" | while read f; do
            echo "--- Testing $f ---"
            node --input-type=module < <(sed 's/\.ets/\.js/g' "$f" | head -1; cat "$f")
          done || true
          echo "HarmonyOS ArkTS type check complete"

  # ──────────────────────────────────────────────────────────────────────────
  # Android
  # ──────────────────────────────────────────────────────────────────────────
  test-android:
    name: Android Kotlin / JDK 17
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - uses: gradle/actions/setup-gradle@v3
      - working-directory: android
        run: ./gradlew :circle-ai:test --info

  # ──────────────────────────────────────────────────────────────────────────
  # Summary gate — all must pass
  # ──────────────────────────────────────────────────────────────────────────
  all-tests-pass:
    name: All SDK Tests
    runs-on: ubuntu-latest
    needs:
      - test-csharp
      - test-python
      - test-typescript
      - test-go
      - test-kotlin
      - test-swift
      - test-rust
      - test-c
      - test-harmonyos
      - test-android
    steps:
      - run: echo "All 10 language SDK tests passed ✓"
