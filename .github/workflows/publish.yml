name: Publish — All SDKs

# Publishes all language packages on a version tag push (v*.*.*).
# Each language publishes to its own registry.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.1.0)"
        required: true

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Guard: all tests must pass before any publish
  # ──────────────────────────────────────────────────────────────────────────
  run-tests:
    name: All tests (publish gate)
    uses: ./.github/workflows/sdk-tests.yml

  # ──────────────────────────────────────────────────────────────────────────
  # Python → PyPI
  # ──────────────────────────────────────────────────────────────────────────
  publish-python:
    name: Publish Python → PyPI
    runs-on: ubuntu-latest
    needs: run-tests
    environment: pypi
    permissions:
      id-token: write   # OIDC for trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set version
        working-directory: python
        run: sed -i "s/version = \"0.1.0\"/version = \"${VERSION#v}\"/" pyproject.toml
      - name: Build
        working-directory: python
        run: |
          pip install build
          python -m build
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/

  # ──────────────────────────────────────────────────────────────────────────
  # TypeScript → npm
  # ──────────────────────────────────────────────────────────────────────────
  publish-typescript:
    name: Publish TypeScript → npm
    runs-on: ubuntu-latest
    needs: run-tests
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Set version and build
        working-directory: typescript
        run: |
          npm version "${VERSION#v}" --no-git-tag-version
          npm ci
          npm run build
      - name: Publish
        working-directory: typescript
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ──────────────────────────────────────────────────────────────────────────
  # Go → Go Modules (tag push is sufficient; no explicit publish step)
  # ──────────────────────────────────────────────────────────────────────────
  publish-go:
    name: Publish Go → Go Modules (tag)
    runs-on: ubuntu-latest
    needs: run-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Verify module
        working-directory: go
        run: go mod verify
      - name: Tag pushed — module is discoverable
        run: echo "Go module github.com/bhengubv/CircleAI/go@${VERSION} is now discoverable via proxy.golang.org"

  # ──────────────────────────────────────────────────────────────────────────
  # Kotlin JVM → GitHub Packages (Maven)
  # ──────────────────────────────────────────────────────────────────────────
  publish-kotlin:
    name: Publish Kotlin → GitHub Packages
    runs-on: ubuntu-latest
    needs: run-tests
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - uses: gradle/actions/setup-gradle@v3
      - working-directory: kotlin
        run: ./gradlew publish -Pversion="${VERSION#v}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────────────────────────────────
  # Swift → Swift Package Index (tag push + README is sufficient)
  # ──────────────────────────────────────────────────────────────────────────
  publish-swift:
    name: Publish Swift → SPM (tag)
    runs-on: macos-14
    needs: run-tests
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
      - working-directory: swift
        run: swift build -c release
      - run: echo "Swift package CircleAI@${VERSION} available via SPM at https://github.com/bhengubv/CircleAI"

  # ──────────────────────────────────────────────────────────────────────────
  # Rust → crates.io
  # ──────────────────────────────────────────────────────────────────────────
  publish-rust:
    name: Publish Rust → crates.io
    runs-on: ubuntu-latest
    needs: run-tests
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Set version
        working-directory: rust
        run: sed -i "s/^version = \"0.1.0\"/version = \"${VERSION#v}\"/" Cargo.toml
      - name: Publish
        working-directory: rust
        run: cargo publish --token ${{ secrets.CRATES_IO_TOKEN }}

  # ──────────────────────────────────────────────────────────────────────────
  # Android → GitHub Packages (AAR)
  # ──────────────────────────────────────────────────────────────────────────
  publish-android:
    name: Publish Android → GitHub Packages
    runs-on: ubuntu-latest
    needs: run-tests
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - uses: gradle/actions/setup-gradle@v3
      - working-directory: android
        run: ./gradlew :circle-ai:publish -Pversion="${VERSION#v}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────────────────────────────────
  # Summary
  # ──────────────────────────────────────────────────────────────────────────
  publish-complete:
    name: All packages published
    runs-on: ubuntu-latest
    needs:
      - publish-python
      - publish-typescript
      - publish-go
      - publish-kotlin
      - publish-swift
      - publish-rust
      - publish-android
    steps:
      - run: |
          echo "CircleAI ${VERSION} published:"
          echo "  Python  → PyPI:            circle-ai-sdk"
          echo "  TS      → npm:             @bhengubv/circle-ai"
          echo "  Go      → go modules:      github.com/bhengubv/CircleAI/go"
          echo "  Kotlin  → GitHub Packages: com.bhengubv:circle-ai"
          echo "  Swift   → SPM:             CircleAI"
          echo "  Rust    → crates.io:       circle-ai"
          echo "  Android → GitHub Packages: com.bhengubv:circle-ai-android"
