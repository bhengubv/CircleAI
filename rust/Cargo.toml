[package]
name = "circle-ai"
version = "3.5.0"
edition = "2021"
authors = ["Bhengu B.V. <info@bhengubv.com>"]
description = "Circle AI SDK — portable core for the B! companion"
license = "MIT"
repository = "https://github.com/bhengubv/CircleAI"

[dependencies]
tokio = { version = "1", features = ["full"], optional = true }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
bitflags = { version = "2", features = ["serde"] }
regex = "1"

[features]
default = ["async"]
async = ["tokio"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
