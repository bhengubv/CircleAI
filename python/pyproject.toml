[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "circle-ai-sdk"
version = "1.5.0"
description = "Circle AI SDK — on-device AI companion, memory, identity, language, catalog, selector, prompt, upgrade-detection primitives"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Graceful-degrade extras — bare install is pure stdlib; add what you need.
prompt = ["jinja2>=3.1"]
device = ["psutil>=5.9"]
all = ["jinja2>=3.1", "psutil>=5.9"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "jinja2>=3.1", "psutil>=5.9"]

[tool.hatch.build.targets.wheel]
packages = ["src/circle_ai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
